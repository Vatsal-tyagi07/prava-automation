name: Prava Autonomous Agent Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      module:
        description: 'Module to run'
        required: true
        default: 'briefing'
        type: choice
        options:
          - all
          - content
          - outreach
          - briefing
          - probe
      dry_run:
        description: 'Run in dry-run mode (no external posts)'
        required: false
        default: false
        type: boolean
  schedule:
    # 09:00 AM IST is 03:30 UTC
    - cron: '30 3 * * *'
    # 11:00 AM IST is 05:30 UTC
    - cron: '30 5 * * *'
    # 09:00 PM IST is 15:30 UTC
    - cron: '30 15 * * *'

concurrency:
  group: prava-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-test:
    name: Lint, Validate & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Syntax and Import Verification
        run: |
          python -m py_compile *.py
          python -c "import db; db.init_db(); print('DB Initialized successfully')"

      - name: Run Model Probe (if GEMINI_API_KEY available)
        if: env.GEMINI_API_KEY != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python test_probe.py

  execute-module:
    name: Execute Autonomous Module
    needs: validate-and-test
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
      X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
      THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Content Engine (Module A)
        if: (github.event_name == 'workflow_dispatch' && (inputs.module == 'content' || inputs.module == 'all')) || (github.event_name == 'schedule' && github.event.schedule == '30 3 * * *')
        run: |
          python daemon.py --once-content

      - name: Run Lead Outreach (Module B)
        if: (github.event_name == 'workflow_dispatch' && (inputs.module == 'outreach' || inputs.module == 'all')) || (github.event_name == 'schedule' && github.event.schedule == '30 5 * * *')
        run: |
          python daemon.py --once-outreach

      - name: Run Evening Briefing (Module C)
        if: (github.event_name == 'workflow_dispatch' && (inputs.module == 'briefing' || inputs.module == 'all')) || (github.event_name == 'schedule' && github.event.schedule == '30 15 * * *')
        run: |
          python daemon.py --once-briefing

      - name: Upload Artifacts (if generated)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-output
          path: |
            output/
            *.log
            *.db
          if-no-files-found: ignore
